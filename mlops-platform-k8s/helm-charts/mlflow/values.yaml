replicaCount: 2

image:
  repository: ghcr.io/mlflow/mlflow
  tag: "2.12.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

artifactStore:
  type: s3
  s3:
    bucket: mlflow-artifacts
    region: us-east-1
  azureBlob:
    storageAccount: mlflowartifacts
    container: mlflow

backendStore:
  postgresql:
    host: postgresql.mlops.svc.cluster.local
    port: 5432
    database: mlflow
    existingSecret: mlflow-db-secret
    secretKey: password

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: mlflow-basic-auth
  hosts:
    - host: mlflow.internal.company.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
