trigger:
  branches:
    include:
      - main
  paths:
    include:
      - environments/prod/**
      - modules/**

pr:
  branches:
    include:
      - main

variables:
  TF_VERSION: "1.7.5"
  TF_WORKING_DIR: "environments/prod"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
  ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
  ARM_TENANT_ID: $(AZURE_TENANT_ID)
  AWS_REGION: "us-east-1"

pool:
  vmImage: ubuntu-22.04

stages:
  - stage: Validate
    displayName: Lint & Validate
    jobs:
      - job: validate
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: terraform fmt -check -recursive
            displayName: terraform fmt check
            workingDirectory: $(System.DefaultWorkingDirectory)

          - script: |
              terraform init -backend=false
              terraform validate
            displayName: terraform validate
            workingDirectory: $(TF_WORKING_DIR)

          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init
              tflint --recursive
            displayName: tflint

          - script: |
              docker run --rm -v $(System.DefaultWorkingDirectory):/src \
                aquasec/trivy:latest config /src \
                --severity HIGH,CRITICAL \
                --exit-code 1
            displayName: Trivy IaC scan

  - stage: Plan
    displayName: Terraform Plan
    dependsOn: Validate
    jobs:
      - job: plan
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: terraform init + plan
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(TF_WORKING_DIR)
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_OIDC_TOKEN=$idToken
                terraform init
                terraform plan \
                  -var-file=terraform.tfvars \
                  -out=tfplan \
                  -detailed-exitcode
                terraform show -json tfplan > tfplan.json

          - publish: $(TF_WORKING_DIR)/tfplan
            artifact: terraform-plan
            displayName: Publish plan artifact

          - task: PowerShell@2
            displayName: Comment plan on PR
            condition: eq(variables['Build.Reason'], 'PullRequest')
            inputs:
              targetType: inline
              script: |
                $plan = terraform show -no-color $(TF_WORKING_DIR)/tfplan
                $body = "## Terraform Plan`n``````hcl`n$plan`n``````"
                $url = "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/$(System.PullRequest.PullRequestId)/threads?api-version=7.1"
                Invoke-RestMethod -Uri $url -Method Post -Headers @{ Authorization = "Bearer $(System.AccessToken)" } `
                  -ContentType application/json `
                  -Body (ConvertTo-Json @{ comments = @(@{ content = $body; commentType = 1 }) } -Depth 5)

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: apply
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(TF_VERSION)

                - download: current
                  artifact: terraform-plan

                - task: AzureCLI@2
                  displayName: terraform apply
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    addSpnToEnvironment: true
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(TF_WORKING_DIR)
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_OIDC_TOKEN=$idToken
                      terraform init
                      terraform apply -auto-approve $(Pipeline.Workspace)/terraform-plan/tfplan
